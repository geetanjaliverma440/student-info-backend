
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Dashboard QR Code</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .qr-box {
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .scan-text {
            font-size: 14px;
            color: #777;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
</head>

<body>

    <div class="qr-box">

        <h1>🎓 Student Dashboard</h1>

        <p>Scan this QR code to open the Dashboard</p>

        <div id="qrcode"></div>

        <div class="scan-text">
            Scan using your phone camera
        </div>

    </div>

    <script>
        const dashboardURL =
            "https://student-info-backend-gray.vercel.app/Dash";

        new QRCode(document.getElementById("qrcode"), {
            text: dashboardURL,
            width: 220,
            height: 220
        });
    </script>

</body>

</html>
